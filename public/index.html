<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANGA TRACKER</title>
  <!-- Google Fonts for Neo-Brutalist Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Track your favorite manga and stay updated with new chapters">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1 class="title">MANGA TRACKER</h1>
        <div class="auth-control" id="auth-control"></div>
      </div>
      <div class="header-line"></div>
      <div class="demo-banner" id="demo-banner" hidden>
        PUBLIC DEMO — anyone can edit this, and it resets daily. Sign in to manage your own library.
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <h2 class="section-title">SEARCH</h2>
      <div class="search-bar">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Enter manga title..."
        >
        <button onclick="searchManga()" class="btn btn-primary">SEARCH</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </section>

    <!-- Tracked Manga Section -->
    <section class="tracked-section">
      <div class="library-header">
        <h2 class="section-title">YOUR LIBRARY</h2>
        <div class="library-controls">
          <div class="next-check-timer" id="next-check-timer">
            Next check: <span id="timer-display">--:--:--</span>
          </div>
          <button onclick="manualRefresh()" class="btn-refresh" id="refresh-btn" title="Refresh all manga">
            <span class="refresh-icon">↻</span>
          </button>
        </div>
      </div>
      <div class="header-palette-panel" hidden>
        <span class="palette-label">HEADER COLOR</span>
        <div id="header-palette" class="header-palette" aria-label="Choose a header color"></div>
      </div>
      <div id="manga-list" class="manga-grid"></div>
    </section>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">REMOVE MANGA?</h3>
      <p id="modal-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">CANCEL</button>
        <button id="modal-confirm" class="btn btn-primary">REMOVE</button>
      </div>
    </div>
  </div>

  <div id="source-modal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">READING SITE</h3>
      <p id="source-modal-message" class="modal-message"></p>
      <label for="source-url-input" class="modal-label">Website URL</label>
      <input
        type="url"
        id="source-url-input"
        class="modal-input"
        placeholder="https://example.com/manga"
        autocomplete="off"
        spellcheck="false"
      >
      <p id="source-modal-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="source-modal-cancel" class="btn btn-secondary">CANCEL</button>
        <button id="source-modal-clear" class="btn btn-secondary">CLEAR</button>
        <button id="source-modal-save" class="btn btn-primary">SAVE</button>
      </div>
    </div>
  </div>

  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">SIGN IN</h3>
      <label for="login-username" class="modal-label">Username</label>
      <input type="text" id="login-username" class="modal-input" autocomplete="username" spellcheck="false">
      <label for="login-password" class="modal-label">Password</label>
      <input type="password" id="login-password" class="modal-input" autocomplete="current-password">
      <p id="login-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="login-cancel" class="btn btn-secondary">CANCEL</button>
        <button id="login-submit" class="btn btn-primary">SIGN IN</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
