<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANGA TRACKER</title>
  <!-- Google Fonts for Neo-Brutalist Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Track your favorite manga and stay updated with new chapters">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">MANGA TRACKER</h1>
      <div class="header-line"></div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <h2 class="section-title">SEARCH</h2>
      <div class="search-bar">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Enter manga title..."
        >
        <button onclick="searchManga()" class="btn btn-primary">SEARCH</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </section>

    <!-- Tracked Manga Section -->
    <section class="tracked-section">
      <div class="library-header">
        <h2 class="section-title">YOUR LIBRARY</h2>
        <div class="library-controls">
          <div class="next-check-timer" id="next-check-timer">
            Next check: <span id="timer-display">--:--:--</span>
          </div>
          <button onclick="manualRefresh()" class="btn-refresh" id="refresh-btn" title="Refresh all manga">
            <span class="refresh-icon">↻</span>
          </button>
        </div>
      </div>
      <div id="manga-list" class="manga-grid"></div>
    </section>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">REMOVE MANGA?</h3>
      <p id="modal-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-secondary">CANCEL</button>
        <button id="modal-confirm" class="btn btn-primary">REMOVE</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
